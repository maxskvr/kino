<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Смотрим вместе</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#111;color:#eee;display:flex;flex-direction:column;min-height:100vh}
  #setup{padding:24px 16px;max-width:420px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:12px}
  h1{font-size:24px;text-align:center;margin:8px 0 16px}
  .btn,button{background:#e50914;color:#fff;border:0;border-radius:10px;padding:14px;font-size:16px;text-align:center;cursor:pointer}
  button.alt{background:#333}
  input[type=text]{background:#222;color:#eee;border:1px solid #444;border-radius:10px;padding:14px;font-size:16px;width:100%}
  .row{display:flex;gap:8px}.row>*{flex:1}
  .or{text-align:center;color:#777;font-size:13px}
  #fname{font-size:13px;color:#aaa;text-align:center;word-break:break-all}
  .hint{font-size:13px;color:#888;line-height:1.4}
  #top{padding:8px 12px;font-size:13px;color:#aaa;text-align:center;min-height:30px}
  #dbg{padding:0 12px 6px;font:11px/1.4 monospace;color:#6c6;display:none}
  body.debug #dbg{display:block}
  #hostbar{display:none;padding:8px}
  body.host #hostbar{display:block}
  #chsrc{width:100%}
  #srcpanel{display:none;flex-direction:column;gap:10px;margin-top:10px}
  #srcpanel.open{display:flex}
  #gfile{display:none;margin:8px}
  .nickrow input[type=color]{flex:0 0 56px;height:52px;padding:4px;background:#222;border:1px solid #444;border-radius:10px}
  #player{display:none}
  body.on #player{display:block}
  body.on #setup{display:none}
  video{width:100%;max-height:60vh;background:#000;display:block}
  #ytwrap{position:relative;width:100%;padding-top:56.25%;background:#000;display:none}
  #ytwrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  #chat{display:none;flex:1;flex-direction:column;padding:8px;gap:8px}
  body.on #chat{display:flex}
  #log{flex:1;overflow-y:auto;font-size:15px;min-height:80px;max-height:30vh}
  #log div{padding:4px 0}
  #log b{color:#e50914}
  #f{display:flex;gap:8px}
  #f input{flex:1}
  #f button{padding:0 18px}
</style>
</head>
<body>
<div id="top"></div>
<div id="dbg"></div>

<div id="setup">
  <h1>🎬 Смотрим вместе <small style="font-size:12px;color:#666">v8</small></h1>
  <label class="btn">Выбрать файл с телефона
    <input type="file" id="file" accept="video/*" hidden>
  </label>
  <div class="or">— или —</div>
  <input type="text" id="url" placeholder="Ссылка: YouTube, .mp4 или .m3u8" autocomplete="off">
  <div id="fname"></div>
  <div class="row nickrow">
    <input type="text" id="nick" placeholder="Ваш ник" maxlength="20" autocomplete="off">
    <input type="color" id="color" title="Цвет ника">
  </div>
  <input type="text" id="room" placeholder="Код комнаты, например kino123" autocomplete="off">
  <div class="row">
    <button id="create">Создать</button>
    <button id="join" class="alt">Войти</button>
  </div>
  <button id="share" class="alt">📺 Транслировать вкладку Chrome (с ПК)</button>
  <div class="hint">
    Создатель комнаты выбирает файл, ссылку или трансляцию. Остальные вводят тот же код и нажимают «Войти» —
    зрителей может быть сколько угодно. Если это файл, у каждого должен быть такой же.
  </div>
</div>

<div id="player">
  <video id="v" controls playsinline></video>
  <div id="ytwrap"><div id="ytbox"></div></div>
  <label id="gfile" class="btn">📁 Выбрать такой же файл<input type="file" id="file3" accept="video/*" hidden></label>
  <div id="hostbar">
    <button id="chsrc" class="alt">🔄 Сменить источник</button>
    <div id="srcpanel">
      <label class="btn">Выбрать файл<input type="file" id="file2" accept="video/*" hidden></label>
      <div class="or">— или —</div>
      <div class="row">
        <input type="text" id="url2" placeholder="Ссылка: YouTube, .mp4 или .m3u8" autocomplete="off">
        <button id="open2" style="flex:0 0 auto">Открыть</button>
      </div>
      <button id="share2" class="alt">📺 Транслировать вкладку Chrome</button>
    </div>
  </div>
</div>

<div id="chat">
  <div id="log"></div>
  <form id="f"><input type="text" id="msg" placeholder="Сообщение…" autocomplete="off"><button>➤</button></form>
</div>

<script>
const $ = id => document.getElementById(id);
const v = $('v');
const PREFIX = 'smotrim-vmeste-room-';
let peer = null, conn = null, isHost = false, remote = false, hls = null;
let conns = [];          // у создателя: все зрители
let ME = { nick: 'Гость', color: '#e50914' };

// Журнал виден только если открыть сайт с #debug в конце адреса
if (/debug/.test(location.hash)) document.body.classList.add('debug');

// ---------- Ник и цвет (запоминаются на устройстве) ----------
const COLORS = ['#ff5c5c', '#ffb347', '#ffd93d', '#6bcb77', '#4d96ff', '#c77dff', '#ff6fb5', '#36cfc9'];
function store(k, val){
  try { if (val === undefined) return localStorage.getItem(k); localStorage.setItem(k, val); } catch (e) { return null; }
}
$('nick').value = store('nick') || '';
$('color').value = store('color') || COLORS[Math.floor(Math.random() * COLORS.length)];
function readMe(){
  ME = { nick: $('nick').value.trim().slice(0, 20) || 'Гость' + Math.floor(Math.random() * 100), color: $('color').value };
  store('nick', ME.nick); store('color', ME.color);
}
const safeColor = c => /^#[0-9a-f]{6}$/i.test(c || '') ? c : '#e50914';
const sys = t => addMsg('Система', t, '#888');

// ---------- Единый интерфейс плеера: обычное видео или YouTube ----------
const P = {
  kind: null, url: null, yt: null,
  ytOk(){ return this.yt && this.yt.getCurrentTime; },
  time(){ return this.kind === 'yt' ? (this.ytOk() ? this.yt.getCurrentTime() : 0) : v.currentTime; },
  dur(){ return this.kind === 'yt' ? (this.ytOk() ? this.yt.getDuration() : 0) : v.duration; },
  paused(){
    if (this.kind !== 'yt') return v.paused;
    if (!this.ytOk()) return true;
    const s = this.yt.getPlayerState();
    return s !== 1 && s !== 3; // 1 = идёт, 3 = буферизация
  },
  play(){
    if (this.kind === 'yt'){ if (this.ytOk()) this.yt.playVideo(); return Promise.resolve(); }
    return v.play();
  },
  pause(){ this.kind === 'yt' ? (this.ytOk() && this.yt.pauseVideo()) : v.pause(); },
  seek(t){ this.kind === 'yt' ? (this.ytOk() && this.yt.seekTo(t, true)) : (v.currentTime = t); },
};

function status(t){ $('top').textContent = t; dbg(t); }
function dbg(t){
  const d = document.createElement('div');
  d.textContent = new Date().toTimeString().slice(0, 8) + ' ' + t;
  $('dbg').appendChild(d);
  while ($('dbg').children.length > 8) $('dbg').firstChild.remove();
}
// Следим за состоянием видеосоединения
function watchCall(call){
  const pc = call.peerConnection;
  if (!pc){ setTimeout(() => watchCall(call), 300); return; }
  pc.addEventListener('iceconnectionstatechange', () => dbg('видео-сеть: ' + pc.iceConnectionState));
  pc.addEventListener('track', e => dbg('пришла дорожка: ' + e.track.kind));
}
function addMsg(who, text, color){
  const d = document.createElement('div');
  const b = document.createElement('b'); b.textContent = who + ': ';
  b.style.color = safeColor(color);
  d.appendChild(b); d.appendChild(document.createTextNode(text));
  $('log').appendChild(d); $('log').scrollTop = 1e9;
}
// Создатель рассылает всем зрителям (кроме except), зритель — только создателю
function send(m, except){
  (isHost ? conns : (conn ? [conn] : [])).forEach(c => { if (c !== except && c.open) c.send(m); });
}
function hostStatus(){ status('Комната «' + hostStatus.room + '» · зрителей: ' + conns.filter(c => c.open).length); }
function showPlayer(){
  v.style.display = P.kind === 'yt' ? 'none' : 'block';
  $('ytwrap').style.display = P.kind === 'yt' ? 'block' : 'none';
  if (P.kind && (isHost || (conn && conn.open))) document.body.classList.add('on');
}

// Изменения, пришедшие от собеседника, не отправляем обратно
function applyRemote(fn){
  remote = true; fn();
  clearTimeout(applyRemote.t);
  applyRemote.t = setTimeout(() => remote = false, P.kind === 'yt' ? 2000 : 600);
}

// ---------- Загрузка источников ----------
function resetVideo(){
  if (hls){ hls.destroy(); hls = null; }
  if (P.yt && P.yt.stopVideo) P.yt.stopVideo();
  v.srcObject = null; v.muted = false;
  v.removeAttribute('src'); v.load();
}

function loadFile(f){
  resetVideo();
  P.kind = 'v'; P.url = null; P.fileName = f.name;
  v.src = URL.createObjectURL(f);
  $('fname').textContent = '✔ ' + f.name;
  showPlayer();
}

function ytId(u){
  const m = u.match(/(?:youtu\.be\/|[?&]v=|shorts\/|embed\/|live\/)([\w-]{11})/);
  return m && m[1];
}

function loadUrl(u){
  P.url = u; P.fileName = null;
  const id = ytId(u);
  if (id){ resetVideo(); loadYT(id); $('fname').textContent = '✔ YouTube'; showPlayer(); return; }
  resetVideo();
  P.kind = 'v';
  if (/\.m3u8(\?|#|$)/i.test(u) && !v.canPlayType('application/vnd.apple.mpegurl')){
    if (window.Hls && Hls.isSupported()){
      hls = new Hls();
      hls.loadSource(u);
      hls.attachMedia(v);
      hls.on(Hls.Events.ERROR, (e, d) => {
        if (d.fatal) status('⚠️ Поток не загружается: ссылка устарела или сайт не разрешает смотреть его на других страницах');
      });
    } else status('Этот браузер не умеет играть .m3u8');
  } else {
    v.src = u;
  }
  $('fname').textContent = '✔ Ссылка добавлена';
  showPlayer();
}

v.addEventListener('error', () => {
  if (P.url && P.kind === 'v' && !hls)
    status('⚠️ Видео не загружается: ссылка устарела, нужен https или сайт запрещает');
});

function loadYT(id){
  P.kind = 'yt';
  const make = () => {
    if (P.yt && P.yt.loadVideoById){ P.yt.cueVideoById(id); return; }
    P.yt = new YT.Player('ytbox', {
      videoId: id,
      playerVars: { playsinline: 1, rel: 0 },
      events: { onStateChange: onYT }
    });
  };
  if (window.YT && YT.Player) make();
  else {
    window.onYouTubeIframeAPIReady = make;
    const s = document.createElement('script');
    s.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(s);
  }
}

$('file').onchange = e => { const f = e.target.files[0]; if (f){ $('url').value = ''; loadFile(f); } };
$('url').onchange = () => { const u = $('url').value.trim(); if (u) loadUrl(u); };

// ---------- Комната ----------
function prepare(needSource){
  const u = $('url').value.trim();
  if (u && u !== P.url) loadUrl(u);
  if (needSource && !P.kind){ alert('Сначала выберите файл или вставьте ссылку'); return null; }
  const r = roomCode(); if (!r) return null;
  // «Разблокируем» воспроизведение на телефоне, пока есть нажатие пользователя
  if (P.kind === 'v') v.play().then(() => v.pause()).catch(() => {});
  return r;
}

function roomCode(){
  const r = $('room').value.trim().toLowerCase().replace(/[^a-z0-9]/g, '');
  if (!r) alert('Введите код комнаты (латинские буквы и цифры)');
  return r || null;
}

$('create').onclick = () => { const r = prepare(true); if (r) startHost(r); };

// ---------- Трансляция вкладки ----------
if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia || /Android|iPhone|iPad/i.test(navigator.userAgent))
{
  $('share').style.display = 'none';
  $('share2').style.display = 'none';
}

async function startShare(){
  let s;
  try {
    s = await navigator.mediaDevices.getDisplayMedia({
      video: { frameRate: 30 }, audio: true,
      selfBrowserSurface: 'exclude', surfaceSwitching: 'include'
    });
  } catch (e) { status('Трансляция отменена'); return false; }
  const vt = s.getVideoTracks()[0];
  vt.contentHint = 'motion';
  vt.onended = () => { status('⏹ Трансляция остановлена'); sys('Трансляция остановлена'); send({ type: 'sys', text: 'Трансляция остановлена' }); };
  stopStream(); resetVideo();
  P.kind = 'stream'; P.url = null; P.fileName = null; P.stream = s;
  v.srcObject = s; v.muted = true; v.play().catch(() => {});
  if (!s.getAudioTracks().length)
    sys('⚠️ Звук не захвачен. Перезапустите трансляцию и включите «Поделиться звуком вкладки»');
  return true;
}

$('share').onclick = async () => {
  const r = roomCode(); if (!r) return;
  if (await startShare()) startHost(r);
};

// Остановить прежнюю трансляцию и видеозвонки зрителям
let activeCalls = [];
function stopStream(){
  if (P.stream){ P.stream.getTracks().forEach(t => t.stop()); P.stream = null; }
  activeCalls.forEach(c => { try { c.close(); } catch (e) {} });
  activeCalls = [];
}

// ---------- Смена источника (только у создателя) ----------
$('chsrc').onclick = () => $('srcpanel').classList.toggle('open');
function announce(m, text){
  send(m); sys(text); showPlayer();
  $('srcpanel').classList.remove('open');
}
$('file2').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  stopStream(); loadFile(f); e.target.value = '';
  announce({ type: 'src', file: f.name }, 'Источник: файл «' + f.name + '»');
};
$('open2').onclick = () => {
  const u = $('url2').value.trim(); if (!u) return;
  stopStream(); loadUrl(u); $('url2').value = '';
  announce({ type: 'src', url: u }, 'Источник: ссылка');
};
$('share2').onclick = async () => {
  if (!(await startShare())) return;
  announce({ type: 'src', stream: true }, 'Источник: трансляция вкладки');
  setTimeout(() => conns.forEach(c => { if (c.open) callGuest(c); }), 700);
};

// Зритель: выбрать такой же файл, как у создателя
$('file3').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  loadFile(f); $('gfile').style.display = 'none';
};

// Создатель: отправить видео зрителю c
const pendingCalls = new Set();
function callGuest(c){
  if (!P.stream || !P.stream.active){ status('⚠️ Трансляция не идёт — нажмите «Транслировать» заново'); return; }
  if (peer.disconnected){
    dbg('нет связи с сервером — переподключаемся, затем отправим видео');
    pendingCalls.add(c);
    if (!callGuest.waiting){
      callGuest.waiting = true;
      peer.once('open', () => { callGuest.waiting = false; const l = [...pendingCalls]; pendingCalls.clear(); l.forEach(callGuest); });
    }
    if (!peer.destroyed) peer.reconnect();
    return;
  }
  const call = peer.call(c.peer, P.stream);
  if (!call){ dbg('не удалось отправить видео'); return; }
  activeCalls.push(call);
  call.on('error', e => dbg('ошибка видео: ' + (e.type || e)));
  watchCall(call);
  dbg('отправляем видео ' + (c.nick || c.peer));
}

// Второй: если видео не пришло, просим ещё раз (до 4 раз)
function askStream(n){
  setTimeout(() => {
    if (v.srcObject) return;
    if (n >= 4){ status('⚠️ Видео не доходит. Попробуйте другую сеть (Wi-Fi) у одного из вас'); return; }
    dbg('запрашиваем видео ещё раз (' + (n + 1) + ')');
    send({ type: 'wantStream' });
    askStream(n + 1);
  }, 5000);
}

function onCall(call){
  dbg('звонок с видео получен');
  call.on('error', e => status('⚠️ Ошибка видео: ' + (e.type || e)));
  call.answer();
  watchCall(call);
  call.on('stream', s => {
    if (v.srcObject === s) return;
    resetVideo();
    P.kind = 'stream'; P.url = null;
    v.srcObject = s;
    showPlayer();
    v.play().catch(() => {
      v.muted = true; v.play().catch(() => {});
      status('🔇 Нажмите на видео, чтобы включить звук');
      v.addEventListener('click', () => { v.muted = false; status('✅ Подключено'); }, { once: true });
    });
  });
}

// Если связь с сервером пропала — восстанавливаем её сами
function keepAlive(p){
  p.on('disconnected', () => {
    dbg('связь с сервером потеряна, переподключаемся…');
    setTimeout(() => { if (p.disconnected && !p.destroyed) p.reconnect(); }, 1000);
  });
}

function startHost(r){
  readMe();
  isHost = true; hostStatus.room = r;
  document.body.classList.add('host');
  peer = new Peer(PREFIX + r);
  keepAlive(peer);
  status('Создаём комнату…');
  peer.once('open', () => {
    hostStatus();
    showPlayer();
    sys('Комната «' + r + '» создана. Отправьте друзьям код — они вводят его и нажимают «Войти».');
  });
  peer.on('open', () => dbg('связь с сервером есть'));
  peer.on('connection', setup);
  peer.on('error', err => status(err.type === 'unavailable-id'
    ? 'Этот код уже занят, придумайте другой' : 'Ошибка: ' + err.type));
}

$('join').onclick = () => {
  const r = prepare(false); if (!r) return;
  readMe();
  peer = new Peer();
  keepAlive(peer);
  peer.on('call', onCall);
  status('Подключаемся…');
  peer.once('open', () => setup(peer.connect(PREFIX + r, { reliable: true })));
  peer.on('error', err => status(err.type === 'peer-unavailable'
    ? 'Комната не найдена. Сначала второй человек должен нажать «Создать»' : 'Ошибка: ' + err.type));
};

function setup(c){
  if (isHost) conns.push(c); else conn = c;
  c.on('open', () => {
    if (isHost){
      const d = P.dur();
      c.send({ type: 'hello', dur: isFinite(d) ? d : 0, url: P.url, stream: P.kind === 'stream', nick: ME.nick, color: ME.color });
      if (P.kind === 'stream') callGuest(c);
      else c.send({ type: 'sync', t: P.time(), paused: P.paused() });
      hostStatus();
    } else {
      status('✅ Подключено');
      c.send({ type: 'hello', nick: ME.nick, color: ME.color });
    }
    showPlayer();
  });
  c.on('data', m => onData(m, c));
  c.on('close', () => {
    if (isHost){
      conns = conns.filter(x => x !== c);
      const t = (c.nick || 'Кто-то') + ' вышел(а)';
      sys(t); send({ type: 'sys', text: t });
      hostStatus();
    } else { status('❌ Соединение потеряно'); sys('Соединение с комнатой потеряно'); }
  });
}

function onData(m, c){
  const far = (t, d) => Math.abs(P.time() - t) > d;
  // Создатель пересылает действия и чат одного зрителя всем остальным
  if (isHost && /^(play|pause|seek|chat)$/.test(m.type)) send(m, c);
  if (isHost && m.type === 'hello'){
    c.nick = String(m.nick || 'Гость').slice(0, 20);
    const t = c.nick + ' присоединился(ась)';
    sys(t); send({ type: 'sys', text: t }, c);
    return;
  }
  if (P.kind === 'stream' && /^(play|pause|seek|sync)$/.test(m.type)) return;
  if (m.type === 'play') applyRemote(() => {
    if (far(m.t, 1)) P.seek(m.t);
    if (P.paused()) P.play().catch(() => status('Нажмите ▶, чтобы продолжить'));
  });
  else if (m.type === 'pause') applyRemote(() => {
    if (!P.paused()) P.pause();
    if (far(m.t, 1)) P.seek(m.t);
  });
  else if (m.type === 'seek') applyRemote(() => {
    if (far(m.t, 1)) P.seek(m.t);
  });
  else if (m.type === 'sync') applyRemote(() => {
    if (far(m.t, 2)) P.seek(m.t);
    if (m.paused && !P.paused()) P.pause();
    if (!m.paused && P.paused()) P.play().catch(() => {});
  });
  else if (m.type === 'chat') addMsg(String(m.nick || '?').slice(0, 20), String(m.text), m.color);
  else if (m.type === 'sys') sys(String(m.text));
  else if (m.type === 'src' && !isHost){
    $('gfile').style.display = 'none';
    if (m.url){ loadUrl(m.url); sys('Создатель сменил видео. Нажмите ▶, если не запустится.'); }
    else if (m.stream){
      resetVideo(); P.kind = 'stream'; P.url = null; showPlayer();
      sys('Создатель включил трансляцию вкладки'); askStream(0);
    }
    else if (m.file){
      resetVideo(); P.kind = 'v'; P.url = null; showPlayer();
      sys('Создатель включил файл «' + String(m.file) + '» — выберите такой же');
      $('gfile').style.display = 'block';
    }
  }
  else if (m.type === 'wantStream'){ if (isHost && P.kind === 'stream') callGuest(c); }
  else if (m.type === 'hello'){
    sys('Вы в комнате у ' + String(m.nick || 'создателя').slice(0, 20) + '. Управляйте плеером как обычно — у всех всё повторится.');
    if (!P.kind){
      if (m.url){ loadUrl(m.url); sys('Видео открыто по ссылке создателя комнаты. Нажмите ▶, если не запустится.'); }
      else if (m.stream){ status('Подключаем трансляцию…'); askStream(0); }
      else status('Создатель смотрит свой файл — выберите такой же файл');
    } else if (P.kind === 'v' && !P.url && v.duration && m.dur && Math.abs(v.duration - m.dur) > 3) {
      sys('⚠️ Длительность файлов отличается — возможно, у вас разные версии фильма');
    }
  }
}

// ---------- Отправка своих действий ----------
v.addEventListener('play',   () => { if (!remote && P.kind === 'v') send({ type: 'play',  t: v.currentTime }); });
v.addEventListener('pause',  () => { if (!remote && P.kind === 'v') send({ type: 'pause', t: v.currentTime }); });
v.addEventListener('seeked', () => { if (!remote && P.kind === 'v') send({ type: 'seek',  t: v.currentTime }); });

function onYT(e){
  if (remote) return;
  if (e.data === 1) send({ type: 'play',  t: P.time() });
  if (e.data === 2) send({ type: 'pause', t: P.time() });
}

// YouTube не сообщает о перемотке — замечаем скачки времени сами
let lastT = 0, lastTs = 0;
setInterval(() => {
  if (P.kind !== 'yt' || !P.ytOk()) return;
  const now = Date.now(), t = P.time();
  const expected = lastT + (P.paused() ? 0 : (now - lastTs) / 1000);
  if (lastTs && !remote && Math.abs(t - expected) > 2) send({ type: 'seek', t });
  lastT = t; lastTs = now;
}, 1000);

// Создатель комнаты раз в 5 секунд подправляет расхождение
setInterval(() => { if (isHost && !remote && P.kind !== 'stream') send({ type: 'sync', t: P.time(), paused: P.paused() }); }, 5000);

$('f').onsubmit = e => {
  e.preventDefault();
  const t = $('msg').value.trim(); if (!t) return;
  send({ type: 'chat', text: t, nick: ME.nick, color: ME.color });
  addMsg(ME.nick, t, ME.color); $('msg').value = '';
};
</script>
